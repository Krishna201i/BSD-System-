<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stroke Model Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script defer src="/static/dashboard.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <h1>Model Dashboard</h1>
          <p>Global feature importance from the trained XGBoost model.</p>
        </div>
        <a class="secondary-btn" href="/">Back to Predictor</a>
      </header>

      <section class="card">
        <h2>Feature Importance</h2>
        <canvas id="importance-chart" height="280"></canvas>
      </section>

      <section class="card">
        <h2>Model Metrics</h2>
        <div id="metrics-grid" class="metrics-grid"></div>
      </section>
    </main>
  </body>
</html>
